name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes compare with the previous version tag
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # v0.1.0 releases manifest version 0.1.0; v0.1.0-rc.1 is a pre-release of it.
      - name: Check the tag against the manifest version
        run: |
          version=$(jq -r .version manifest.json)
          case "${GITHUB_REF_NAME#v}" in
            "$version" | "$version"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1 ;;
          esac

      - run: npm test
      - run: scripts/build.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="officebird-${GITHUB_REF_NAME#v}.xpi"
          mv dist/officebird.xpi "dist/$name"
          # Only stable releases carry updates.json, so installed copies never update to a pre-release.
          case "$GITHUB_REF_NAME" in
            *-*) pre="--prerelease"; updates="" ;;
            *) pre=""; updates="dist/updates.json"
               node .github/scripts/updates-json.mjs "$GITHUB_REF_NAME" "dist/$name" > "$updates" ;;
          esac
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "dist/$name" $updates --verify-tag $pre \
            --title "Officebird ${GITHUB_REF_NAME#v}" --notes-file notes.md
